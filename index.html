<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anjali, five letters for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#3a1c3d;--soft:#6e4a6c;--coral:#e8505b;--cream:#fff4ea;--paper:#fffaf3}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;font-family:Figtree,system-ui,sans-serif;color:var(--ink)}
body{background:linear-gradient(180deg,#ffd9c4 0%,#f7a9b9 38%,#b9a2e6 72%,#5d4a8c 100%);background-size:100% 140%;animation:sky 24s ease-in-out infinite alternate}
@keyframes sky{to{background-position:0 100%}}
canvas{position:fixed;inset:0;width:100%;height:100%}
#fx{pointer-events:none;z-index:6}
main{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.top{font-family:"Young Serif",serif;font-size:clamp(28px,6vw,46px);line-height:1.1;max-width:640px}
.sub{margin-top:10px;font-size:17px;color:var(--soft);max-width:420px;line-height:1.5}
.hearts{display:flex;gap:8px;justify-content:center;margin:0 0 22px}
.hearts i{width:14px;height:13px;background:rgba(58,28,61,.22);clip-path:path("M7 13C-5 5 1-3 7 2c6-5 12 3 0 11z")}
.hearts i.d{background:var(--coral)}
.scene{perspective:900px;margin-top:34px}
.env{position:relative;width:min(300px,78vw);aspect-ratio:3/2;cursor:pointer;transform-style:preserve-3d;transition:transform .5s;border:0;background:none;padding:0;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{translate:0 -8px}}
.env .back,.env .front{position:absolute;inset:0;border-radius:6px}
.env .back{background:#f3d3bf;box-shadow:0 26px 50px rgba(58,28,61,.35)}
.env .front{background:var(--cream);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);filter:drop-shadow(0 -2px 6px rgba(0,0,0,.06))}
.env .flap{position:absolute;left:0;right:0;top:0;height:58%;background:#ffe9d8;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s;z-index:2}
.env .seal{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7b83,var(--coral) 60%,#b52a37);z-index:3;display:grid;place-items:center;color:#fff;font-family:"Young Serif",serif;font-size:19px;box-shadow:0 4px 10px rgba(120,20,30,.4);transition:opacity .3s}
.env.open .flap{transform:rotateX(180deg)}.env.open .seal{opacity:0}
.tap{margin-top:26px;font-family:Kalam,cursive;font-size:21px;color:var(--soft)}
.paper{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(58,28,61,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.paper.on{display:flex}
.sheet{width:min(500px,100%);max-height:92vh;overflow:auto;background:repeating-linear-gradient(var(--paper) 0 31px,#f1dccb 31px 32px);border-radius:4px;padding:34px 28px 26px;box-shadow:0 30px 80px rgba(30,5,40,.5);animation:up .6s cubic-bezier(.2,.8,.2,1);text-align:left}
@keyframes up{from{transform:translateY(60px) rotate(2deg);opacity:0}}
.sheet h3{font-family:"Young Serif",serif;font-weight:400;font-size:27px;margin-bottom:10px;line-height:1.15}
.sheet .txt{font-family:Kalam,cursive;font-size:21px;line-height:32px;white-space:pre-line;min-height:96px}
.sig{font-family:Kalam,cursive;font-size:22px;margin-top:12px;color:var(--coral);font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
button.b,a.b{font:inherit;font-weight:600;font-size:16px;cursor:pointer;border:0;border-radius:999px;padding:13px 24px;background:var(--coral);color:#fff;text-decoration:none;display:inline-block;transition:transform .15s,box-shadow .2s;box-shadow:0 8px 20px rgba(232,80,91,.35)}
button.b:hover,a.b:hover{transform:translateY(-2px)}
button.b:focus-visible,a.b:focus-visible,.env:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button.alt{background:transparent;color:var(--ink);box-shadow:none;border:1.5px solid rgba(58,28,61,.4)}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){.env,body{animation:none}.sheet{animation:none}}
</style>
</head>
<body>
<canvas id="bg"></canvas><canvas id="fx"></canvas>
<main id="m">
  <div class="hearts" id="hs"></div>
  <h1 class="top" id="tt"></h1>
  <p class="sub" id="ss"></p>
  <div class="scene"><button class="env" id="env" aria-label="Open the letter"><div class="back"></div><div class="front"></div><div class="flap"></div><div class="seal">A</div></button></div>
  <div class="tap" id="tp">tap the envelope</div>
</main>
<div class="paper" id="pp"><div class="sheet" id="sh"></div></div>

<script>
(function(){
"use strict";
/* ===== EDIT THIS PART: make it about her ===== */
var NAME='Anjali', FROM='Hitesh', PHONE='919554022084';
var LIKES=[];            // e.g. ['anime','night drives','mango shake'], things SHE told you she loves
var INSIDE_JOKE='';      // optional: a real moment from you two, one short sentence
var PLAN='a chai and a long chat';
/* ============================================= */
var likeTxt=LIKES.length?('I love how you are into '+LIKES.slice(0,-1).join(', ')+(LIKES.length>1?' and ':'')+LIKES[LIKES.length-1]+'. It tells me you have taste and a soul that enjoys small things.'):'The way you enjoy the little things, a good song, a good laugh, a good cup of something warm, makes people around you enjoy them too.';
var L=[
 {t:'Hi '+NAME+',',x:'This is a small thing I made with my own hands, a bit of code and a lot of nerves.\n\nBefore anything else: I am not trying to impress you with magic tricks. I only wanted to say something kind to you in a way you would remember.'},
 {t:'What I notice',x:likeTxt+(INSIDE_JOKE?'\n\n'+INSIDE_JOKE:'')+'\n\nYou are easy to be around, and that is rarer than people think.'},
 {t:'A tiny confession',x:'I rewrote the first line of these letters nine times.\nI also tested the page on my phone four times and smiled at it each time like a fool.\n\nIf you are laughing a little, my plan is working.',choice:[['Okay, that is cute','Noted. Hitesh is celebrating quietly in a corner.'],['You are so dramatic','Correct. But sincerely dramatic.']]},
 {t:'What I am really asking',x:'No big dramatic plan. Just '+PLAN+', somewhere comfortable, where you can leave whenever you want and I will not mind.\n\nYou are in charge of the day, the place and the time.'},
 {t:'So, '+NAME+'...',x:'Would you like to meet me sometime?\n\nWhatever you say, thank you for reading all of this.',ask:1}
];
var i=0,env=document.getElementById('env'),pp=document.getElementById('pp'),sh=document.getElementById('sh');
function $(x){return document.getElementById(x);}
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function head(){
  $('hs').innerHTML=L.map(function(_,k){return '<i class="'+(k<=i?'d':'')+'"></i>';}).join('');
  $('tt').textContent=i===0?'Five letters, one for each thing I wanted to say.':'Letter '+(i+1)+' of '+L.length;
  $('ss').textContent=i===0?'Open them in order, ' + NAME + '. Take your time.':'';
  env.classList.remove('open');$('tp').textContent='tap the envelope';
}
function typer(el,t,done){if(reduce){el.textContent=t;done();return;}var k=0;(function s(){el.textContent=t.slice(0,k++);if(k<=t.length)setTimeout(s,22);else done();})();}
env.onclick=function(){
  if(env.classList.contains('open'))return;
  env.classList.add('open');$('tp').textContent='';
  setTimeout(function(){openLetter(L[i]);},reduce?0:700);
};
function openLetter(l){
  sh.innerHTML='<h3></h3><div class="txt"></div><div class="reply sig hide"></div><div class="row hide"></div>';
  sh.querySelector('h3').textContent=l.t;pp.classList.add('on');
  var row=sh.querySelector('.row');
  typer(sh.querySelector('.txt'),l.x,function(){
    row.classList.remove('hide');
    if(l.choice){l.choice.forEach(function(c){var b=document.createElement('button');b.className='b alt';b.textContent=c[0];
      b.onclick=function(){sh.querySelector('.reply').textContent=c[1];sh.querySelector('.reply').classList.remove('hide');row.innerHTML='';row.appendChild(nextBtn());burst(innerWidth/2,innerHeight/2,26);};row.appendChild(b);});}
    else if(l.ask){var y=document.createElement('button');y.className='b';y.textContent='Yes, I would like that';y.onclick=yes;
      var n=document.createElement('button');n.className='b alt';n.textContent='Maybe another time';n.onclick=no;row.appendChild(y);row.appendChild(n);}
    else row.appendChild(nextBtn());
  });
}
function nextBtn(){var b=document.createElement('button');b.className='b';b.textContent='Next letter';
  b.onclick=function(){pp.classList.remove('on');i++;head();};return b;}
function yes(){
  sh.innerHTML='<h3>You said yes.</h3><div class="txt">I am smiling at my phone like an idiot. Thank you, '+NAME+'.\n\nLet us pick a time that suits you. Send me a message and tell me when you are free.</div><div class="sig">- '+FROM+'</div><div class="row"></div>';
  var a=document.createElement('a');a.className='b';a.target='_blank';a.rel='noopener';a.textContent='Message '+FROM;
  a.href='https://wa.me/'+PHONE+'?text='+encodeURIComponent('Hi '+FROM+', this is '+NAME+'. I read your letters, and yes, I would like to meet. Maybe we could plan '+PLAN+'?');
  sh.querySelector('.row').appendChild(a);
  [0,300,700,1200].forEach(function(d){setTimeout(function(){burst(innerWidth/2,innerHeight*.4,60);},d);});
}
function no(){
  sh.innerHTML='<h3>Thank you for being honest.</h3><div class="txt">That is completely okay. I hope the letters made you smile anyway.\n\nWishing you a lovely day, '+NAME+'.</div><div class="sig">- '+FROM+'</div><div class="row"><button class="b alt" id="rr">Read again</button></div>';
  $('rr').onclick=function(){pp.classList.remove('on');i=0;head();};
}
/* ---------- background lanterns + hearts ---------- */
var bg=$('bg'),b=bg.getContext('2d'),fx=$('fx'),f=fx.getContext('2d'),W,H,mx=0,L2=[],P=[];
function size(){W=bg.width=fx.width=innerWidth;H=bg.height=fx.height=innerHeight;}
addEventListener('resize',size);size();
addEventListener('pointermove',function(e){mx=e.clientX/W-.5;});
for(var k=0;k<26;k++)L2.push({x:Math.random(),y:Math.random(),r:10+Math.random()*34,v:.0003+Math.random()*.0007,p:Math.random()*6.3,c:['255,170,120','255,120,150','255,214,150','200,170,255'][k%4],z:.3+Math.random()});
function heart(x,y,s){f.beginPath();f.moveTo(x,y+s*.35);f.bezierCurveTo(x-s,y-s*.3,x-s*.45,y-s,x,y-s*.4);f.bezierCurveTo(x+s*.45,y-s,x+s,y-s*.3,x,y+s*.35);f.fill();}
function burst(x,y,n){for(var k=0;k<n;k++){var a=Math.random()*6.28,v=2+Math.random()*6;P.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,s:5+Math.random()*9,l:1,c:['#e8505b','#ff8aa0','#ffd1a8','#fff'][k%4]});}}
function tick(t){
  b.clearRect(0,0,W,H);
  L2.forEach(function(o){o.y-=o.v;if(o.y<-.1){o.y=1.1;o.x=Math.random();}
    var x=o.x*W+Math.sin(t/2000+o.p)*18+mx*60*o.z,y=o.y*H,g=b.createRadialGradient(x,y,0,x,y,o.r*2);
    g.addColorStop(0,'rgba('+o.c+',.55)');g.addColorStop(.35,'rgba('+o.c+',.22)');g.addColorStop(1,'rgba('+o.c+',0)');
    b.fillStyle=g;b.beginPath();b.arc(x,y,o.r*2,0,6.3);b.fill();});
  f.clearRect(0,0,W,H);
  for(var k=P.length-1;k>=0;k--){var p=P[k];p.x+=p.vx;p.y+=p.vy;p.vy+=.14;p.vx*=.99;p.l-=.01;if(p.l<=0){P.splice(k,1);continue;}
    f.globalAlpha=p.l;f.fillStyle=p.c;heart(p.x,p.y,p.s);}
  f.globalAlpha=1;requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
/* envelope tilt */
$('m').addEventListener('pointermove',function(e){if(env.classList.contains('open'))return;
  env.style.transform='rotateY('+((e.clientX/W-.5)*18)+'deg) rotateX('+(-(e.clientY/H-.5)*14)+'deg)';});
head();
})();
</script>
</body>
</html>
